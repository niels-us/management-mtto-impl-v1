service: maintenance-api

frameworkVersion: '4'
configValidationMode: warn

provider:
  name: aws
  runtime: nodejs24.x
  stage: ${opt:stage,'DESA'}
  region: ${self:custom.regions.code.${opt:stage}}
  timeout: 29
  memorySize: 512
  versionFunctions: false
  logRetentionInDays: 30
  architecture: arm64

  tracing:
    lambda: true

  apiGateway:
    apiKeySourceType: HEADER
    apiKeys:
      - name: maintenanceApiKey
        description: API Key for Maintenance API

  deploymentBucket:
    name: ${self:custom.deploymentBucket.${opt:stage}}
    serverSideEncryption: AES256

  tags:
    FOCODAMB: ${self:custom.environmentsTags.${opt:stage}}
    FOCODAPP: MAINTENANCEAPI
    Environment: ${self:provider.stage}
    Project: MaintenanceAPI
    ManagedBy: Serverless

  stackTags:
    FOCODAMB: ${self:custom.environmentsTags.${opt:stage}}
    FOCODAPP: MAINTENANCEAPI
    Environment: ${self:provider.stage}

  environment:
    REGION: ${self:provider.region}
    STAGE: ${self:provider.stage}
    LOG_LEVEL: ${self:custom.logLevel.${opt:stage}, 'INFO'}
    NODE_ENV: ${self:provider.stage}
    SERVICE_NAME: maintenance-api    
    # Database (DynamoDB - single table)
    DYNAMODB_TABLE_NAME: ${ssm:${self:custom.ssmRootPath}/DYNAMODB_TABLE_NAME, env:DYNAMODB_TABLE_NAME, 'mtto-maintenance-desa'} #_DYN
    DYNAMODB_ENDPOINT: ${param:dynamoEndpoint, ''} # empty in AWS; local offline passes --param=dynamoEndpoint=http://dynamodb-local:8000
    # JWT
    JWT_SECRET: ${ssm:${self:custom.ssmRootPath}/JWT_SECRET, env:JWT_SECRET, '###'} #_JWT
    JWT_AUDIENCE: 'maintenance-api'
    JWT_ISSUER: 'maintenance-api-issuer'
    JWT_EXPIRATION: '24h'
    # Groq LLM Configuration (AI Feature)
    GROQ_API_KEY: ${ssm:${self:custom.ssmRootPath}/GROQ_API_KEY, env:GROQ_API_KEY, '###'} #_GRO
    # Configurar con tu API Key de Groq desde https://console.groq.com

custom:
  functionsFile: ${param:functionsFile, 'cloud'}
  
  # Load from common-custom-config.yaml
  accounts: ${file(./config/serverless/common-custom-config.yaml):accounts}
  accountId: ${self:custom.accounts.id.${opt:stage}}
  role: ${file(./config/serverless/common-custom-config.yaml):role}
  vpc: ${file(./config/serverless/common-custom-config.yaml):vpc}
  deploymentBucket: ${file(./config/serverless/common-custom-config.yaml):deploymentBucket}
  environmentsTags: ${file(./config/serverless/common-custom-config.yaml):environmentsTags}
  regions: ${file(./config/serverless/common-custom-config.yaml):regions}
  provisionedConcurrency: ${file(./config/serverless/common-custom-config.yaml):provisionedConcurrency}
  # Service naming
  serviceName: ${self:custom.regions.abrev.${opt:stage}}${self:custom.accounts.abrev.${opt:stage}}${opt:stage}MTOMAINTENANCEAPI
  
  # SSM configuration
  ssmName: MAINTENANCE-API
  ssmRootPath: /${self:custom.ssmName}/${self:provider.stage}
  
  # Log levels per environment
  logLevel:
    DESA: DEBUG
    TEST: INFO
    PROD: INFO

plugins:
  - serverless-offline

package:
  individually: true
  patterns:
    - '!node_modules/**'
    - '!dist/**'
    - '!config/**'
    - '!src/**'
    - '!coverage/**'
    - '!test/**'
    - '!jest.*'
    - '!**/*.test.ts'
    - '!**/*.spec.ts'
    - '!tsconfig.json'
    - '!pnpm-lock.yaml'
    - '!.env'
    - '!Dockerfile'
    - '!.dockerignore'
    - '!docker-compose.yml'
    - '!docker.env.example'
    - '!README.md'
    - '!ANSWERS.md'
    - '!.prettierrc'
    - '!.eslintrc.yml'
    - '!.npmrc'
    - 'node_modules/bcrypt/**'
    - 'node_modules/node-gyp-build/**'
    - 'dist-bundle/**'
    - 'openapi.json'
    - 'package.json'

functions: ${file(config/serverless/functions.${self:custom.functionsFile}.yaml)}